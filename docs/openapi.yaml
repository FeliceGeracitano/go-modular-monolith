openapi: 3.1.0
info:
  title: go-modular-monolith
  version: 0.1.0
  description: >
    Example HTTP API for the modular monolith template.
    Demonstrates synchronous cross-module contract queries (`orders` -> `customersapi`)
    and asynchronous integration events (`orders` -> `outbox` -> `notifications`).

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Customers
    description: Customer CRUD with pagination
  - name: Orders
    description: Order placement, filtering, and cancellation (emits integration events)
  - name: Notifications
    description: Outbox-driven notifications observable over HTTP
  - name: System
    description: Health and readiness probes

paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      tags: [Customers]
      summary: Register a customer
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Customer created
          headers:
            Location:
              description: URL of the created customer
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get a customer by ID
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [Customers]
      summary: Update a customer profile
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Email already registered by another customer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [Customers]
      summary: Delete a customer
      operationId: deleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Customer deleted
        "404":
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      parameters:
        - name: customer_id
          in: query
          description: Filter by customer ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [placed, cancelled]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
    post:
      tags: [Orders]
      summary: Place an order
      description: >
        Validates that the customer exists via `customersapi`, stores the order,
        and queues `orders.order_placed.v1` in the outbox for async delivery to subscribers.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          headers:
            Location:
              description: URL of the created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "422":
          description: Validation error (unknown customer, invalid lines, mixed currencies)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: >
        Transitions an order from `placed` to `cancelled` and queues
        `orders.order_cancelled.v1` in the outbox.
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Order is already cancelled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List sent notifications
      description: >
        Returns notifications produced asynchronously by the outbox relay
        in response to `orders.order_placed.v1` and `orders.order_cancelled.v1`.
      operationId: listNotifications
      parameters:
        - name: customer_id
          in: query
          description: Filter by customer ID
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [System]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: object
                    additionalProperties:
                      type: string

components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum items to return (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    RegisterCustomerRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          example: Augusta Ada King
        email:
          type: string
          format: email
          example: ada.king@example.com

    Customer:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    CustomerList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    OrderLine:
      type: object
      required: [sku, quantity, unit_price]
      properties:
        sku:
          type: string
          example: BOOK-1
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 2
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Unit price in minor currency units (e.g. cents)
          example: 1250

    PlaceOrderRequest:
      type: object
      required: [customer_id, currency, lines]
      properties:
        customer_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"

    Order:
      type: object
      required: [id, customer_id, status, currency, total_amount, lines, placed_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [placed, cancelled]
        currency:
          type: string
          example: EUR
        total_amount:
          type: integer
          format: int64
          description: Total amount in minor currency units
          example: 2500
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        placed_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time

    OrderList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Notification:
      type: object
      required: [id, event_id, customer_id, recipient, subject, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        recipient:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Problem:
      type: object
      description: RFC 9457 Problem Details error response
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Unprocessable Entity
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: customer does not exist
        code:
          type: string
          example: orders.unknown_customer
        request_id:
          type: string
