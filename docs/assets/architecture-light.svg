<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 564" width="1120" height="564" role="img" aria-label="go-modular-monolith architecture overview">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.08em; }
      .sec-label { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .sec-meta { font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.06em; }
      .card-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .chip-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .chip-sub { font-size: 9.5px; fill: #475569; }
      .badge-blue { font-size: 10px; font-weight: 700; fill: #0369a1; }
      .badge-purple { font-size: 10px; font-weight: 700; fill: #6d28d9; }
      .badge-green { font-size: 10px; font-weight: 700; fill: #047857; }
      .small { font-size: 10px; fill: #475569; }
      .tiny { font-size: 9.5px; font-weight: 600; fill: #64748b; }
    </style>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="2" y="2" width="1116" height="560" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="34" class="mono title">go-modular-monolith</text>
  <text x="232" y="34" class="sans subtitle">ARCHITECTURE OVERVIEW</text>

  <!-- Legend -->
  <g transform="translate(656, 20)">
    <line x1="0" y1="10" x2="24" y2="10" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="32" y="14" class="sans small">Sync contract call</text>

    <line x1="144" y1="10" x2="168" y2="10" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
    <text x="176" y="14" class="sans small">Async outbox event</text>

    <rect x="294" y="2" width="18" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="318" y="14" class="sans small">Enforced boundary</text>
  </g>

  <!-- Band 1: main.go -> app/ -->
  <rect x="28" y="56" width="214" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="77" class="mono card-title">main.go</text>
  <text x="44" y="93" class="sans chip-sub">Single binary · HTTP + relay</text>

  <line x1="242" y1="80" x2="266" y2="80" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-solid)"/>

  <rect x="270" y="56" width="822" height="48" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="286" y="77" class="mono card-title" fill="#0369a1">app/</text>
  <text x="336" y="77" class="sans small">Composition root (app.go + modules.go) · Hand-wired DI graph · Zero DI framework</text>
  <text x="286" y="93" class="sans chip-sub">Wires modules, mounts /docs, /healthz, /readyz &amp; routes, subscribes handlers, graceful shutdown</text>

  <!-- Arrows app -> modules -->
  <line x1="202" y1="104" x2="202" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <line x1="560" y1="104" x2="560" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <line x1="918" y1="104" x2="918" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Band 2: modules/ -->
  <rect x="28" y="132" width="1064" height="220" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="44" y="152" class="mono sec-label">modules/</text>
  <text x="116" y="152" class="sans sec-meta">BUSINESS DOMAINS · DEPENDENCIES DECLARED IN module.json &amp; VERIFIED BY test/arch</text>

  <!-- Module 1: customers -->
  <g transform="translate(44, 162)">
    <rect x="0" y="0" width="316" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" class="mono card-title">customers</text>
    <rect x="220" y="8" width="84" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="262" y="20" text-anchor="middle" class="mono tiny">uses: []</text>

    <rect x="12" y="32" width="292" height="28" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="22" y="50" class="mono badge-blue">customersapi</text>
    <text x="126" y="50" class="sans chip-sub">Public contract (leaf pkg)</text>

    <rect x="12" y="68" width="292" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="22" y="84" class="mono badge-green">internal/</text>
    <text x="86" y="84" class="sans tiny">flat private pkg (compiler-enforced)</text>

    <rect x="22" y="94" width="130" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="87" y="109" text-anchor="middle" class="mono chip-title">customer · service</text>
    <text x="87" y="121" text-anchor="middle" class="sans chip-sub">model · use cases · ports</text>

    <rect x="162" y="94" width="132" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="228" y="109" text-anchor="middle" class="mono chip-title">http · store</text>
    <text x="228" y="121" text-anchor="middle" class="sans chip-sub">routes · in-memory repo</text>

    <text x="22" y="152" class="mono chip-sub">CRUD /api/v1/customers</text>
  </g>

  <!-- Module 2: orders -->
  <g transform="translate(402, 162)">
    <rect x="0" y="0" width="316" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" class="mono card-title">orders</text>
    <rect x="180" y="8" width="124" height="18" rx="9" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="242" y="20" text-anchor="middle" class="mono badge-blue">uses: [customers]</text>

    <rect x="12" y="32" width="292" height="28" rx="6" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="22" y="50" class="mono badge-purple">ordersapi</text>
    <text x="104" y="50" class="sans chip-sub">OrderPlaced · OrderCancelled</text>

    <rect x="12" y="68" width="292" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="22" y="84" class="mono badge-green">internal/</text>
    <text x="86" y="84" class="sans tiny">flat private pkg (compiler-enforced)</text>

    <rect x="22" y="94" width="130" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="87" y="109" text-anchor="middle" class="mono chip-title">order · service</text>
    <text x="87" y="121" text-anchor="middle" class="sans chip-sub">invariants · money · ports</text>

    <rect x="162" y="94" width="132" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="228" y="109" text-anchor="middle" class="mono chip-title">http · store · acl</text>
    <text x="228" y="121" text-anchor="middle" class="sans chip-sub">routes · mem · customers</text>

    <text x="22" y="152" class="mono chip-sub">POST/GET /api/v1/orders · /cancel</text>
  </g>

  <!-- Module 3: notifications -->
  <g transform="translate(760, 162)">
    <rect x="0" y="0" width="316" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" class="mono card-title">notifications</text>
    <rect x="136" y="8" width="168" height="18" rx="9" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="220" y="20" text-anchor="middle" class="mono badge-purple">uses: [customers, orders]</text>

    <rect x="12" y="32" width="292" height="28" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="22" y="50" class="mono badge-blue">event subscriber</text>
    <text x="140" y="50" class="sans chip-sub">placed + cancelled events</text>

    <rect x="12" y="68" width="292" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="22" y="84" class="mono badge-green">internal/</text>
    <text x="86" y="84" class="sans tiny">flat private pkg (compiler-enforced)</text>

    <rect x="22" y="94" width="130" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="87" y="109" text-anchor="middle" class="mono chip-title">service</text>
    <text x="87" y="121" text-anchor="middle" class="sans chip-sub">idempotent on event_id</text>

    <rect x="162" y="94" width="132" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="228" y="109" text-anchor="middle" class="mono chip-title">http · adapters</text>
    <text x="228" y="121" text-anchor="middle" class="sans chip-sub">sub · mem · ACL · log</text>

    <text x="22" y="152" class="mono chip-sub">GET /api/v1/notifications</text>
  </g>

  <!-- Inter-module arrows -->
  <line x1="402" y1="208" x2="364" y2="208" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="381" y="200" text-anchor="middle" class="mono badge-blue">sync</text>

  <line x1="718" y1="208" x2="756" y2="208" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  <text x="739" y="200" text-anchor="middle" class="mono badge-purple">event</text>

  <!-- Arrows modules -> pkg -->
  <line x1="202" y1="352" x2="202" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <line x1="560" y1="352" x2="560" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
  <line x1="918" y1="352" x2="918" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Band 3: pkg/ -->
  <rect x="28" y="376" width="1064" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="394" class="mono sec-label">pkg/</text>
  <text x="82" y="394" class="sans sec-meta">SHARED REUSABLE PACKAGES · KNOWS NO BUSINESS LOGIC · NEVER IMPORTS modules/ OR app/</text>

  <g transform="translate(40, 405)">
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" class="mono chip-title">httpx</text>
    <text x="70" y="32" text-anchor="middle" class="sans chip-sub">net/http · OpenAPI</text>

    <rect x="150" y="0" width="140" height="42" rx="6" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.1"/>
    <text x="220" y="17" text-anchor="middle" class="mono badge-purple">outbox + bus</text>
    <text x="220" y="32" text-anchor="middle" class="sans chip-sub">async relay · OTel ctx</text>

    <rect x="300" y="0" width="140" height="42" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="370" y="17" text-anchor="middle" class="mono badge-blue">telemetry</text>
    <text x="370" y="32" text-anchor="middle" class="sans chip-sub">OpenTelemetry OTLP</text>

    <rect x="450" y="0" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="520" y="17" text-anchor="middle" class="mono chip-title">logging</text>
    <text x="520" y="32" text-anchor="middle" class="sans chip-sub">log/slog · trace IDs</text>

    <rect x="600" y="0" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="670" y="17" text-anchor="middle" class="mono chip-title">config</text>
    <text x="670" y="32" text-anchor="middle" class="sans chip-sub">typed env · validated</text>

    <rect x="750" y="0" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="820" y="17" text-anchor="middle" class="mono chip-title">apperr</text>
    <text x="820" y="32" text-anchor="middle" class="sans chip-sub">RFC 9457 error kinds</text>

    <rect x="900" y="0" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="970" y="17" text-anchor="middle" class="mono chip-title">id · clock</text>
    <text x="970" y="32" text-anchor="middle" class="sans chip-sub">UUIDv7 · injectable</text>
  </g>

  <!-- Band 4 Left: Enforced Guardrails -->
  <rect x="28" y="478" width="692" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="42" y="496" class="sans badge-green" letter-spacing="0.06em">ENFORCED BY COMPILER &amp; test/arch</text>

  <g transform="translate(40, 504)">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" class="mono badge-green">internal/ privacy</text>

    <rect x="169" y="0" width="160" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="249" y="18" text-anchor="middle" class="mono badge-green">AST test/arch</text>

    <rect x="338" y="0" width="160" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="418" y="18" text-anchor="middle" class="mono badge-green">acyclic module DAG</text>

    <rect x="507" y="0" width="160" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="587" y="18" text-anchor="middle" class="mono badge-green">lint + govulncheck</text>
  </g>

  <!-- Band 4 Right: Data Layer Note -->
  <rect x="736" y="478" width="356" height="66" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="752" y="497" class="sans sec-label">DATA LAYER · BRING YOUR OWN</text>
  <text x="752" y="514" class="sans chip-sub">No DB or migrations baked in. Modules ship with in-memory</text>
  <text x="752" y="529" class="sans chip-sub">stores — swap in Postgres, SQLite, or DynamoDB per port.</text>
</svg>
