<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" width="1000" height="408" role="img" aria-label="go-modular-monolith conceptual architecture">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 16px; font-weight: 700; fill: #f0f6fc; }
      .sec-label { font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .sec-meta { font-size: 11px; fill: #8b949e; }
      .card-title { font-size: 14px; font-weight: 700; fill: #f0f6fc; }
      .card-sub { font-size: 11px; fill: #9ca3af; }
      .pill { font-size: 11px; font-weight: 600; fill: #e6edf3; }
      .badge-blue { font-size: 10.5px; font-weight: 700; fill: #58a6ff; }
      .badge-purple { font-size: 10.5px; font-weight: 700; fill: #c4b5fd; }
      .badge-green { font-size: 10.5px; font-weight: 700; fill: #34d399; }
      .small { font-size: 10.5px; fill: #9ca3af; }
      .footer { font-size: 11px; fill: #8b949e; }
    </style>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="2" y="2" width="996" height="404" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="34" class="mono title">go-modular-monolith</text>

  <!-- Legend -->
  <g transform="translate(576, 21)">
    <line x1="0" y1="9" x2="22" y2="9" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="30" y="13" class="sans small">Sync contract</text>

    <line x1="126" y1="9" x2="148" y2="9" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
    <text x="156" y="13" class="sans small">Async event</text>

    <rect x="246" y="2" width="16" height="14" rx="3" fill="#0b2e24" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="270" y="13" class="sans small">Private boundary</text>
  </g>

  <!-- Band 1: main.go -> app/ -->
  <rect x="28" y="52" width="124" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="90" y="78" text-anchor="middle" class="mono card-title">main.go</text>

  <line x1="152" y1="73" x2="176" y2="73" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow-solid)"/>

  <rect x="180" y="52" width="792" height="42" rx="10" fill="#0c2438" stroke="#1f6feb" stroke-width="1.3"/>
  <text x="200" y="78" class="mono card-title" fill="#58a6ff">app/</text>
  <text x="252" y="78" class="sans card-sub">Composition root · wires modules, HTTP, OpenAPI /docs &amp; outbox relay</text>

  <!-- Arrow app -> modules -->
  <line x1="500" y1="94" x2="500" y2="114" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Band 2: modules/ (conceptual pattern) -->
  <rect x="28" y="118" width="944" height="172" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="48" y="141" class="mono sec-label">modules/</text>
  <text x="122" y="141" class="sans sec-meta">Import from another module ONLY via its public &lt;name&gt;api/ defined for consumption (declared in module.json)</text>

  <!-- Module A -->
  <g transform="translate(52, 156)">
    <rect x="0" y="0" width="264" height="118" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="24" class="mono card-title">module A</text>

    <rect x="14" y="34" width="236" height="28" rx="6" fill="#0c2438" stroke="#1f6feb" stroke-width="1.1"/>
    <text x="24" y="52" class="mono badge-blue">aapi/</text>
    <text x="66" y="52" class="sans small">public API (for consumption)</text>

    <rect x="14" y="70" width="236" height="36" rx="7" fill="#0b2e24" stroke="#10b981" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="24" y="92" class="mono badge-green">internal/</text>
    <text x="92" y="92" class="sans small">private · blocked by Go</text>
  </g>

  <!-- Sync arrow: Module B -> Module A's aapi/ -->
  <line x1="368" y1="204" x2="320" y2="204" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="342" y="195" text-anchor="middle" class="mono badge-blue">sync</text>

  <!-- Module B -->
  <g transform="translate(368, 156)">
    <rect x="0" y="0" width="264" height="118" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="24" class="mono card-title">module B</text>

    <rect x="14" y="34" width="236" height="28" rx="6" fill="#21163a" stroke="#7c3aed" stroke-width="1.1"/>
    <text x="24" y="52" class="mono badge-purple">bapi/</text>
    <text x="66" y="52" class="sans small">public API &amp; events</text>

    <rect x="14" y="70" width="236" height="36" rx="7" fill="#0b2e24" stroke="#10b981" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="24" y="92" class="mono badge-green">internal/</text>
    <text x="92" y="92" class="sans small">private · blocked by Go</text>
  </g>

  <!-- Async event arrow: Module B's bapi/ -> Module C -->
  <line x1="632" y1="204" x2="680" y2="204" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  <text x="658" y="195" text-anchor="middle" class="mono badge-purple">event</text>

  <!-- Module C / N -->
  <g transform="translate(684, 156)">
    <rect x="0" y="0" width="264" height="118" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="24" class="mono card-title">module C</text>
    <text x="248" y="24" text-anchor="end" class="sans sec-meta">+ N domains</text>

    <rect x="14" y="34" width="236" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.1"/>
    <text x="24" y="52" class="mono pill">capi/</text>
    <text x="66" y="52" class="sans small">optional public API</text>

    <rect x="14" y="70" width="236" height="36" rx="7" fill="#0b2e24" stroke="#10b981" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="24" y="92" class="mono badge-green">internal/</text>
    <text x="92" y="92" class="sans small">private · blocked by Go</text>
  </g>

  <!-- Arrow modules -> pkg -->
  <line x1="500" y1="290" x2="500" y2="310" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-solid)"/>

  <!-- Band 3: pkg/ -->
  <rect x="28" y="314" width="944" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="48" y="346" class="mono sec-label">pkg/</text>

  <g transform="translate(104, 326)">
    <rect x="0" y="0" width="134" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="67" y="19" text-anchor="middle" class="mono pill">httpx · /docs</text>

    <rect x="146" y="0" width="154" height="30" rx="6" fill="#21163a" stroke="#7c3aed" stroke-width="1"/>
    <text x="223" y="19" text-anchor="middle" class="mono badge-purple">outbox · eventbus</text>

    <rect x="312" y="0" width="148" height="30" rx="6" fill="#0c2438" stroke="#1f6feb" stroke-width="1"/>
    <text x="386" y="19" text-anchor="middle" class="mono badge-blue">telemetry · slog</text>

    <rect x="472" y="0" width="110" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="527" y="19" text-anchor="middle" class="mono pill">config</text>

    <rect x="594" y="0" width="114" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="651" y="19" text-anchor="middle" class="mono pill">apperr</text>

    <rect x="720" y="0" width="132" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="786" y="19" text-anchor="middle" class="mono pill">id · clock</text>
  </g>

  <!-- Subtle Footer -->
  <text x="500" y="392" text-anchor="middle" class="sans footer">One-way deps: app → modules → pkg  ·  Acyclic DAG enforced by test/arch  ·  Bring your own DB</text>
</svg>
