name: CD

# main       -> check, publish image, deploy to dev
# tag v1.2.3 -> check, publish image, deploy to staging, then production
#
# One image is built per commit and promoted by digest, so what reaches
# production is byte-for-byte what was tested in staging.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never abandon a deployment half way

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Later jobs deploy this exact digest, not a tag that could move.
      - id: ref
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  # Deployments stay off until the repository variable DEPLOY_ENABLED is
  # "true". See deploy/README.md.

  deploy-dev:
    name: Deploy to dev
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.sh dev "${{ needs.image.outputs.ref }}"

  deploy-staging:
    name: Deploy to staging
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.sh staging "${{ needs.image.outputs.ref }}"

  deploy-production:
    name: Deploy to production
    needs: [image, deploy-staging]
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to make promotion a decision.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.sh production "${{ needs.image.outputs.ref }}"
